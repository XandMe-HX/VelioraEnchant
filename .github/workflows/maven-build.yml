name: Maven Build

on:
  push:
    branches: [ main, clean ]

permissions:
  contents: read

jobs:
  build:
    name: Build VelioraEnchant
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VelioraEnchant
          path: target/VelioraEnchant.jar
          if-no-files-found: error
          retention-days: 14
