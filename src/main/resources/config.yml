# VelioraEnchant 1.6.2 - Paper 1.21.8+
# Old V1 names retained as safe enchant books; V2's high-level vanilla system is included too.
config-version: 6

overlevel:
  enabled: true
  bypass-too-expensive: true
  anvil-base-cost: 25
  anvil-cost-per-extra-level: 15
  mending-two-repair-multiplier: 1.5
  caps:
    sharpness: 7
    smite: 8
    bane_of_arthropods: 8
    efficiency: 7
    power: 7
    punch: 3
    impaling: 8
    loyalty: 5
    riptide: 4
    piercing: 6
    quick_charge: 4
    protection: 6
    fire_protection: 7
    blast_protection: 7
    projectile_protection: 7
    feather_falling: 6
    respiration: 5
    thorns: 5
    unbreaking: 5
    mending: 2
    density: 7
    breach: 5
    wind_burst: 4

# Optional: only has an effect when ExcellentEnchants is installed.
# If matching Excellent enchant is on the same item, Veliora's duplicate effect is not applied.
excellent-enchants-bridge:
  enabled: true

# ExcellentEnchants-only compatibility. These effects heal only on a confirmed kill.
excellent-vampire:
  enabled: true
  max-level: 3
  heal-per-level: 2.0 # 2 health = 1 heart per level
  cooldown-ticks: 60 # 3 seconds

fishing:
  enabled: true
  rarity:
    common: 55.0
    rare: 28.0
    epic: 12.0
    legendary: 4.5
    mythic: 0.45
    secret: 0.05
  secret-catch-chance: 0.0005 # 0.05% when using Veliora Secret I
  # Formula: ADD = Base + Per_Level × (level - 1); MULTIPLY = Base × Per_Level^(level - 1).
  modifiers:
    catch-xp: { Base: 2.0, Per_Level: 1.0, Capacity: 8.0, Action: ADD }
    double-catch-chance: { Base: 0.08, Per_Level: 0.04, Capacity: 0.20, Action: ADD }
    treasure-chance: { Base: 0.03, Per_Level: 0.02, Capacity: 0.10, Action: ADD }
    heal: { Base: 2.0, Per_Level: 1.0, Capacity: 6.0, Action: ADD }

# Safe member progression. Chances stay intentionally low to protect the economy.
distribution:
  enchanting-table:
    enabled: true
    minimum-level-cost: 15
    # Peluang mengikuti kekuatan meja: base + (bookshelf x bonus), lalu dikalikan slot.
    base-chance: 0.08
    chance-per-bookshelf: 0.012
    slot-multipliers: [0.45, 0.70, 1.00]
    # Full level-30 tables can roll up to seven compatible custom enchants.
    # Extra rolls become less likely each time; this is never seven guaranteed enchants.
    maximum-custom-enchants: 7
    # Pilihan ketiga dengan biaya level 30 dan 15 bookshelf selalu memberi
    # sedikitnya dua custom enchant yang kompatibel. Roll berikutnya tetap mengikuti
    # mekanik power vanilla dengan peluang yang makin kecil.
    guaranteed-level-cost: 30
    guaranteed-bookshelves: 15
    full-power-minimum-custom-enchants: 2
  structure-loot:
    enabled: true
    chance: 0.0075 # 0.75% per eligible generated container
    rarity-cap: EPIC
    allowed-tables:
      - minecraft:chests/simple_dungeon
      - minecraft:chests/abandoned_mineshaft
      - minecraft:chests/desert_pyramid
      - minecraft:chests/shipwreck_treasure
      - minecraft:chests/ancient_city
      - minecraft:chests/bastion_treasure
  librarian:
    enabled: true
    chance: 0.30
    rarity-cap: EPIC
    expert-price: 32
    master-price: 48
  fisherman:
    enabled: true
    chance: 0.30
    rarity-cap: EPIC
    master-price: 32
custom-enchants:
  second_wind:
    enabled: true
    max-level: 3
    cooldown-ticks: 1800
  steadfast:
    enabled: true
    max-level: 3
  riposte:
    enabled: true
    max-level: 3
    cooldown-ticks: 200
  careful_hands:
    enabled: true
    max-level: 3
  patient_angler:
    enabled: true
    max-level: 5
  # Other catalogue entries are added automatically with their balanced max level on first startup.
  life_steal: { enabled: true, max-level: 5, heal-per-level: 0.35, cooldown-ticks: 20 }
  auto_smelt: { enabled: true, max-level: 1 }
  telepathy: { enabled: true, max-level: 1 }
  shield_resistance: { enabled: true, max-level: 5, reduction-per-level: 0.10 }
  wind_burst: { enabled: true, max-level: 3, fall-reduction-per-level: 0.10, duration-ticks: 80, cooldown-ticks: 220 }
