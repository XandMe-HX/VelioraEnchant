name: VelioraEnchant
version: '1.0.0'
main: id.velioragardens.enchant.VelioraEnchantPlugin
api-version: '1.21'
author: XandMe-HX
description: Safe, configurable custom enchantments for Veliora Gardens.
commands:
  velioraenchant:
    description: Manage Veliora custom enchantments.
    usage: /<command> give <player> <enchant> <level> | /<command> reload
    aliases: [venchant, ce, enchants, customenchant, customenchants, overenchant, enchantshop, es]
    permission: velioraenchant.admin
permissions:
  velioraenchant.admin:
    default: op
